{{- if and (not .Values.credentials.existingSecret) .Values.credentials.fabrics }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aci-exporter.secretName" . }}
  labels:
    {{- include "aci-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $fabric, $cred := .Values.credentials.fabrics }}
  {{ include "aci-exporter.fabricEnv" $fabric }}_USERNAME: {{ required (printf "credentials.fabrics.%s.username is required" $fabric) $cred.username | quote }}
  {{ include "aci-exporter.fabricEnv" $fabric }}_PASSWORD: {{ required (printf "credentials.fabrics.%s.password is required" $fabric) $cred.password | quote }}
  {{- end }}
{{- end }}
