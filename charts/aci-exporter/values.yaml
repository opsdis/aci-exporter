replicaCount: 1

image:
  repository: ghcr.io/opsdis/aci-exporter
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Main configuration, rendered as config.yaml. Credentials should go to
# `credentials` below instead of being written here.
config:
  fabrics: {}
  #  my_fabric:
  #    apic:
  #      - https://apic1.example.com
  #      - https://apic2.example.com
  httpclient:
    insecureHTTPS: false
    timeout: 30

# Use an existing ConfigMap with a `config.yaml` key instead of `config`
existingConfigMap: ""

# Query files for the config.d directory, keyed by file name. Values can be a
# YAML string or an object. See config.d/ in the repository for examples.
queries: {}
#  health.yaml: |
#    compound_queries:
#      ...

credentials:
  # Existing secret with ACI_EXPORTER_FABRICS_<FABRIC>_USERNAME/_PASSWORD keys,
  # loaded via envFrom. If empty, a secret is created from `fabrics` below.
  existingSecret: ""
  fabrics: {}
  #  my_fabric:
  #    username: monitor
  #    password: secret

env: []
envFrom: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# On OpenShift set runAsUser and runAsGroup to null and let the SCC assign them
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9643
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aci-exporter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
#  requests:
#    cpu: 10m
#    memory: 128Mi
#  limits:
#    memory: 512Mi

livenessProbe:
  httpGet:
    path: /alive
    port: http

readinessProbe:
  httpGet:
    path: /alive
    port: http

# For example a CA bundle to verify the APIC certificates
extraVolumes: []
#  - name: ca-bundle
#    configMap:
#      name: ca-certs
extraVolumeMounts: []
#  - name: ca-bundle
#    mountPath: /etc/ssl/certs/ca-certificates.crt
#    subPath: ca-bundle.crt
#    readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Requires the Prometheus Operator CRDs
serviceMonitor:
  enabled: false
  labels: {}
  interval: 1m
  scrapeTimeout: 30s
  # Scrape the exporter's own metrics on /metrics
  selfMetrics: true
  # One /probe endpoint per entry
  targets: []
  #  - fabric: my_fabric
  #    queries: health,fabric_node_info,faults
  #    interval: 1m
  #    scrapeTimeout: 30s

networkPolicy:
  enabled: false
  # Allowed ingress peers, for example the Prometheus namespace. Empty allows
  # all sources to the service port.
  from: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring
